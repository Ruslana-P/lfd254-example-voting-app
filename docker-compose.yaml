networks:
  vote:
    driver: bridge
services:
  vote:
    build:
      context: ./vote
      dockerfile: Dockerfile
    image: student1mouse/vote:latest
    ports:
      - "5000:80"
    depends_on:
      - redis
    networks:
      - vote
  redis:
    image: redis:6.0-alpine
    networks:
      - vote
  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    image: student1mouse/worker:latest
    depends_on:
      - redis
      - db
    networks:
      - vote
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_HOST_AUTH_METHOD=trust
    networks:
      - vote
  result:
    build:
      context: ./result
      dockerfile: Dockerfile
    image: student1mouse/result:latest
    ports:
      - "5001:80"
    depends_on:
      - db
    networks:
      - vote
